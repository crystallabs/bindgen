<<: spec_base.yml

processors:
  - filter_methods
  - auto_container_instantiation
  - instantiate_containers
  - default_constructor
  - cpp_wrapper
  - crystal_binding
  - crystal_wrapper
  - sanity_check

classes:
  Containers: Containers
  Point: Point
  Points: Points
  QtStyle: QtStyle

containers:
  - class: std::vector
    type: Sequential
    instantiations:
      - [ "int" ]
      - [ "double" ]
      - [ "std::string" ]
      - [ "std::vector<int>" ]
      - [ "rgb" ]
      - [ "unsigned int" ]
  - class: std::__1::vector
    type: Sequential
  - class: std::map
    type: Associative
    instantiations:
      - [ "std::string", "int" ]
  - class: std::__1::map
    type: Associative
  - class: std::unordered_map
    type: Associative
  - class: std::__1::unordered_map
    type: Associative
  - class: std::pair
    type: Pair
  - class: std::__1::pair
    type: Pair
  - class: QtStyleMap
    type: Associative
    count_method: contains
    insert_method: insert
    erase_method: remove

types:
  rgb: { alias_for: "unsigned int" }
  bytearray: { alias_for: "std::vector<unsigned char>" }
  phonebook: { alias_for: "std::map<std::string, int>" }

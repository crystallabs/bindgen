<<: spec_base.yml

# Uses the default processor pipeline.  `bit_fields_inline.yml` uses the same
# types with `bit_fields: Inline`.

classes:
  Flags: Flags
  Constants: Constants
  Hosted: Hosted
  Sizes: Sizes
  Variant: Variant
  ZeroWidth: ZeroWidth

functions:
  "(.*)_(make|sum)": { destination: "Funcs", name: "\\1_\\2" }

types:
  Flags: { copy_structure: true, generate_binding: false, generate_wrapper: false }
  Constants: { copy_structure: true, generate_binding: false, generate_wrapper: false }
  Variant: { copy_structure: true, generate_binding: false, generate_wrapper: false }
  ZeroWidth: { copy_structure: true, generate_binding: false, generate_wrapper: false }
  Sizes: { copy_structure: true, generate_binding: false, generate_wrapper: false }
  Hosted: { copy_structure: true }

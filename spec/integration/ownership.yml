<<: spec_base.yml

processors:
  - default_constructor
  - instance_properties
  - filter_methods
  - crystal_wrapper
  - virtual_override
  - cpp_wrapper
  - crystal_binding
  - sanity_check

classes:
  Counted: Counted
  Dependent: Dependent
  VirtualDependent: VirtualDependent
  Holder: Holder
  Layout: Layout
  Inner: Inner
  Outer: Outer
  SubOuter: SubOuter
  Owner: Owner
  Mutual: Mutual
  Picky: Picky
  Plain: Plain
  First: First
  Second: Second
  Dual: Dual

types:
  Inner:
    instance_variables:
      padding: { ignore: true }
  Outer:
    keep_alive:
      - ^inside$
      - ^store
  Plain:
    kind: Struct
  Picky:
    keep_alive:
      setBoth: [2]
      setNone: false
      ^$: true # Constructors
  Dependent:
    depends_on: [^$, ^retarget$, ^targets$] # Constructors, a method, and a static one
  VirtualDependent:
    depends_on: [^retarget$]
  Holder:
    depends_on: [^$]
  Owner:
    keep_alive:
      ^adopt$: true
      ^swapChild$: [1]
    release:
      ^takeChild$: true # The result
      ^removeChild$: true # The argument
      ^swapChild$: [0] # The first argument only, not the result

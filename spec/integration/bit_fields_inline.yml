<<: spec_base.yml

# Uses the default processor pipeline.  Like `bit_fields.yml`, only with
# `bit_fields: Inline`.

classes:
  Flags: Flags
  Constants: Constants
  Hosted: Hosted
  Sizes: Sizes
  Variant: Variant
  ZeroWidth: ZeroWidth
  AnonymousMember: AnonymousMember

functions:
  "(.*)_(make|sum)": { destination: "Funcs", name: "\\1_\\2" }
  anonymous_bits: Funcs

types:
  Flags: { copy_structure: true, generate_binding: false, generate_wrapper: false, bit_fields: Inline }
  Constants: { copy_structure: true, generate_binding: false, generate_wrapper: false, bit_fields: Inline }
  Variant: { copy_structure: true, generate_binding: false, generate_wrapper: false, bit_fields: Inline }
  ZeroWidth: { copy_structure: true, generate_binding: false, generate_wrapper: false, bit_fields: Inline }
  Sizes: { copy_structure: true, generate_binding: false, generate_wrapper: false, bit_fields: Inline }
  Hosted: { copy_structure: true, bit_fields: Inline }
  AnonymousMember: { copy_structure: true, generate_binding: false, generate_wrapper: false, bit_fields: Inline }

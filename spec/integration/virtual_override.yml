<<: spec_base.yml

processors:
  - filter_methods
  - default_constructor
  - enums
  - inheritance
  - crystal_wrapper
  - virtual_override
  - cpp_wrapper
  - crystal_binding
  - sanity_check

classes:
  Base: Base
  AbstractThing: AbstractThing
  Subclass: Subclass
  Implicit: Implicit
  Summer: Summer
  AbstractScaler: AbstractScaler
  AbstractScalerMiddle: AbstractScalerMiddle
  ConcreteScaler: ConcreteScaler
  Painter: Painter
  AbstractCreator: AbstractCreator
  SolidPainter: SolidPainter
  AbstractShape: AbstractShape
  AbstractRound: AbstractRound
  Circle: Circle
  Shapes: Shapes
  FinalClass: FinalClass
  FinalMethod: FinalMethod
  Skip: Skip
  Module::SuperV: Module::SuperV
  Overloads: Overloads
  Grandparent: Grandparent
  Parent: Parent
  Child: Child
  AbstractSecond: AbstractSecond
  PureGrandparent: PureGrandparent
  AbstractMiddle: AbstractMiddle
  AbstractLeaf: AbstractLeaf
  NamedArgument: NamedArgument
  UnnamedArgument: UnnamedArgument
  OnlyFilteredVirtuals: OnlyFilteredVirtuals
  Named: Named
  Greeter: Greeter
  PoliteGreeter: PoliteGreeter
  AbstractGreeter: AbstractGreeter
  OtherBase: OtherBase
  GreeterObject: GreeterObject
  TextGreeter: TextGreeter
  Moody: Moody

enums:
  Mood: Mood

types:
  Triple: # A built-in structure, like Qt's CrystalVariant; declared in the spec
    builtin: true
    kind: Struct
    pass_by: Value
    binding_type: Triple
    cpp_type: Triple
    crystal_type: "Binding::Triple"
    generate_binding: false
    generate_wrapper: false
  Hidden:
    ignore: true
  Subclass:
    superclass_ignore_methods: [ "^random" ]
  Skip:
    generate_superclass: false
  IgnoredByConfig:
    ignore: true

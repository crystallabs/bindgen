<<: spec_base.yml

processors:
  - filter_methods
  - default_constructor
  - inheritance
  - crystal_wrapper
  - virtual_override
  - cpp_wrapper
  - crystal_binding
  - sanity_check

classes:
  Base: Base
  AbstractThing: AbstractThing
  Subclass: Subclass
  Implicit: Implicit
  FinalClass: FinalClass
  FinalMethod: FinalMethod
  Skip: Skip
  Module::SuperV: Module::SuperV
  Overloads: Overloads
  Grandparent: Grandparent
  Parent: Parent
  Child: Child
  AbstractSecond: AbstractSecond
  PureGrandparent: PureGrandparent
  AbstractMiddle: AbstractMiddle
  AbstractLeaf: AbstractLeaf
  OnlyFilteredVirtuals: OnlyFilteredVirtuals

types:
  Subclass:
    superclass_ignore_methods: [ "^random" ]
  Skip:
    generate_superclass: false
  IgnoredByConfig:
    ignore: true

<<: spec_base.yml

nilable_results: true

classes:
  Node: Node
  Nodes: Nodes
  Left: Left
  Right: Right
  Both: Both
  Visitor: Visitor
  Finder: Finder
  Seeker: Seeker

types:
  Node:
    nilable:
      tail: false
      valueOrDefault: [0]
    rename:
      weight: heaviness
  Visitor:
    rename:
      rate: score
  Seeker:
    nilable:
      "seek()": true

containers:
  - class: std::vector
    type: Sequential
    instantiations: # The nested `std::vector<Node *>` follows from this one
      - [ "std::vector<Node *>" ]
  - class: std::__1::vector
    type: Sequential

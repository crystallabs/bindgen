<<: spec_base.yml

# Uses the default processor pipeline.

classes:
  Adder: AdderWrap
  Ops: Ops
  Clock: Clock
  Init: Init
  Flags: Flags
  Deduced: Deduced
  Deduced::Inner: DeducedInner
  Arrow: Arrow
  Params: Params
  Stream: Stream
  ValueOps: ValueOps
  DeletedOps: DeletedOps
  Pixel: Pixel
  Pixel2: Pixel2
  Timing: Timing
  Mutex: Mutex
  Lockable: Lockable
  NullSink: NullSink
  Mode: Mode
  FreeOps: FreeOps
  ImplicitConstructor: ImplicitConstructor
  Aggregate: Aggregate
  NonMovableAggregate: NonMovableAggregate
  DefaultedConstructor: DefaultedConstructor
  PrivateConstructor: PrivateConstructor
  DeletedConstructor: DeletedConstructor
  TypeConversion: TypeConversion
  PlainStruct: PlainStruct
  Copyable: Copyable
  Undestructible: Undestructible
  Declared: Declared

enums:
  Mode::Kind: Mode::Kind

types:
  Pixel: &value_struct
    copy_structure: true
    kind: Struct
    pass_by: Value
  Pixel2: *value_struct
  "std::chrono::milliseconds": # Through the typedef `Millis`
    cpp_type: int64_t
    binding_type: Int64
    crystal_type: Int64
    builtin: true
    generate_binding: false
    generate_wrapper: false
    pass_by: Value
    to_cpp: "std::chrono::milliseconds(%)"
    from_cpp: "(%.count())"
  Elapsed: # Converted from the result of `Clock::operator-`
    cpp_type: int
    binding_type: Int32
    crystal_type: Int32
    builtin: true
    generate_binding: false
    generate_wrapper: false
    pass_by: Value
    from_cpp: "(%.count())"
    to_cpp: "Elapsed{%}"
  IgnoreMe: # Ignore by type
    ignore: true
  Adder: # Ignore by method name, signature or regular expression
    ignore_methods:
      - ignoreByName
      - "ignoreBySignature(int,int)" # Spacing is normalized
      - "/^ignoreByRegex\\(const char/"
  "char *": # Also matches "cosnt char *" through type decay
    crystal_type: String
    wrapper_pass_by: Value
    to_crystal: "String.new(%)"
    from_crystal: "%.to_unsafe"
  counted_t: # `%` used twice, each code is still evaluated once
    binding_type: Int32
    crystal_type: Int32
    builtin: true
    from_cpp: "(%) * 10 + (%)"
    to_cpp: "(%) + (%)"
    to_crystal: "(%) * (%)"
    from_crystal: "(%) + (%)"
  "std::atomic<int>":
    binding_type: Int32
    crystal_type: Int32
    cpp_type: int
    builtin: true
  Declared:
    declare_methods:
      - "Declared *other() const"
      - "void setOther(Declared *other)"
      - "double scaled(double factor, int times = 2) const"
      - "static int twice(int value)"
    nilable:
      other: true
  PlainStruct:
    generate_binding: false
    generate_wrapper: false
    copy_structure: true

<<: spec_base.yml

# `filter_methods` runs again after `instantiate_containers` and
# `inheritance`, for the parsed methods of the container classes and the
# methods copied from base classes.
processors:
  - default_constructor
  - filter_methods
  - auto_container_instantiation
  - instantiate_containers
  - inheritance
  - filter_methods
  - cpp_wrapper
  - crystal_binding
  - crystal_wrapper
  - sanity_check

classes:
  Lists: Lists
  Polygon: Polygon
  # Container instantiations, wrapped from their parsed methods
  "List<std::string>": StringList
  "ListSpecialMethods<std::string>": StringListMethods

containers:
  - class: List
    type: Sequential

types:
  StringList: { alias_for: "List<std::string>" }
  # The methods of a parsed instantiation name a typedef element type by its
  # underlying type, as Clang stores the template arguments canonically.
  "std::basic_string<char, std::char_traits<char>, std::allocator<char>>": { alias_for: "std::string" }

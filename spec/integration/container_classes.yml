<<: spec_base.yml

# `enums` runs last on purpose: The generator must still define the enum
# before the container of it.
processors:
  - default_constructor
  - filter_methods
  - auto_container_instantiation
  - instantiate_containers
  - inheritance
  - enums
  - cpp_wrapper
  - crystal_binding
  - crystal_wrapper
  - sanity_check

classes:
  Lists: Lists
  Polygon: Polygon
  # Container instantiations, wrapped from their parsed methods
  "List<std::string>": StringList
  "ListSpecialMethods<std::string>": StringListMethods

containers:
  - class: List
    type: Sequential

enums:
  Color: Color

types:
  StringList: { alias_for: "List<std::string>" }

name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  ameba:
    name: Ameba
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: crystal-lang/install-crystal@v1

      - name: Install shards
        run: shards install

      - name: Build Ameba
        run: crystal build -o bin/ameba lib/ameba/bin/ameba.cr

      # Rules and the baseline of known findings are in .ameba.yml
      - name: Run Ameba
        run: bin/ameba

  spec:
    name: LLVM ${{ matrix.llvm }} (${{ matrix.link }}, ${{ matrix.stdlib }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        llvm: [14, 16, 18, 20, 22]
        link: [auto]
        stdlib: [default]
        include:
          - llvm: 22
            link: shared
            stdlib: default
          - llvm: 22
            link: auto
            stdlib: libc++
    env:
      LLVM: ${{ matrix.llvm }}
      # Left empty, static or shared linking is detected.
      BINDGEN_DYNAMIC: ${{ matrix.link == 'shared' && '1' || '' }}
      BINDGEN_CLANG_FLAGS: ${{ matrix.stdlib == 'libc++' && '-stdlib=libc++' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: crystal-lang/install-crystal@v1

      - name: Install dependencies
        run: |
          sudo apt-get update

          # Versions not packaged by Ubuntu come from apt.llvm.org
          if ! apt-cache show "libclang-$LLVM-dev" > /dev/null 2>&1; then
            codename="$(lsb_release -cs)"
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
            echo "deb http://apt.llvm.org/$codename/ llvm-toolchain-$codename-$LLVM main" | sudo tee /etc/apt/sources.list.d/llvm.list
            sudo apt-get update
          fi

          sudo apt-get install -y --no-install-recommends \
            "clang-$LLVM" "libclang-$LLVM-dev" "libclang-cpp$LLVM-dev" "llvm-$LLVM-dev" \
            cmake libgc-dev libpcre2-dev libyaml-dev libevent-dev \
            libxml2-dev libz3-dev libzstd-dev zlib1g-dev libncurses-dev

          if [ "${{ matrix.stdlib }}" = "libc++" ]; then
            sudo apt-get install -y --no-install-recommends "libc++-$LLVM-dev" "libc++abi-$LLVM-dev"
          fi

      - name: Install shards
        run: shards install

      - name: Check formatting
        run: crystal tool format --check src spec clang/find_clang.cr

      - name: Build clang tool
        working-directory: clang
        run: cmake -DLLVM_DIR="/usr/lib/llvm-$LLVM/lib/cmake/llvm" . && make

      - name: Run specs
        run: crystal spec

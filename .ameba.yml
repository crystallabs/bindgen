# Baseline for Ameba, generated by `ameba --gen-config` with version 1.7.0.
#
# Every rule below is switched off only for the files that failed it when the
# baseline was taken; all other files, and new ones, are checked.  Remove an
# entry once the file is clean.  To see what a rule reports, run
# `bin/ameba --ignore-config --only RuleName`.

Version: "1.7.0"

Globs:
  - src/**/*.cr
  - spec/**/*.cr
  - clang/find_clang.cr

Excluded:
  - spec/integration/tmp

# Plain `%` strings pick whichever delimiter doesn't clash with their content,
# which is usually generated C++ or Crystal code full of parentheses.
Style/PercentLiteralDelimiters:
  DefaultDelimiters: ~

Metrics/CyclomaticComplexity:
  Excluded:
  - src/bindgen/cpp/pass.cr
  - src/bindgen/crystal/pass.cr
  - src/bindgen/crystal/type.cr
  - src/bindgen/find_path/generic_version.cr
  - src/bindgen/parser/method.cr
  - src/bindgen/processor/instance_properties.cr

Naming/BlockParameterName:
  Excluded:
  - clang/find_clang.cr
  - spec/clang/spec_helper.cr
  - spec/integration/basic_spec.cr
  - src/bindgen/call_builder/crystal_container_of.cr
  - src/bindgen/cpp/pass.cr
  - src/bindgen/crystal/pass.cr
  - src/bindgen/glue_reader.cr
  - src/bindgen/graph/path.cr
  - src/bindgen/parser/class.cr
  - src/bindgen/parser/method.cr
  - src/bindgen/processor/copy_structs.cr
  - src/bindgen/processor/inheritance.cr
  - src/bindgen/processor/instantiate_containers.cr
  - src/bindgen/processor/virtual_override.cr
  - src/bindgen/template/basic.cr
  - src/bindgen/type_database.cr
  - src/bindgen/util.cr

Naming/QueryBoolMethods:
  Excluded:
  - src/bindgen/call.cr
  - src/bindgen/configuration.cr
  - src/bindgen/find_path/configuration.cr
  - src/bindgen/type_database.cr

Style/MultilineStringLiteral:
  Excluded:
  - spec/bindgen/config_reader/parser_spec.cr
  - spec/clang/classes_spec.cr
  - spec/clang/functions_spec.cr
  - spec/clang/macros_spec.cr
  - spec/integration/spec_helper.cr

# Ameba configuration.  All rules are checked with their defaults, except for
# the deliberate deviations below.  To see what a rule reports without this
# configuration, run `bin/ameba --ignore-config --only RuleName`.

Version: "1.7.0"

Globs:
  - src/**/*.cr
  - spec/**/*.cr
  - clang/find_clang.cr

Excluded:
  - spec/integration/tmp

# Plain `%` strings pick whichever delimiter doesn't clash with their content,
# which is usually generated C++ or Crystal code full of parentheses.
Style/PercentLiteralDelimiters:
  DefaultDelimiters: ~

# Short blocks conventionally name their parameter by initial: `|m|` for a
# method or match, `|t|` for a type, `|f|` for a field, `|l, r|` for pairs.
Naming/BlockParameterName:
  AllowedNames: [a, b, e, i, j, k, v, x, y, k1, k2, v1, v2, db, ex, id, io, ip, op, tx, wg, ws, f, l, m, r, t]

# Known offenders, mostly long flat `if`/`case` chains over kinds of types,
# methods and operators.  Splitting them up would scatter rules which are
# easier to follow side by side.
Metrics/CyclomaticComplexity:
  Excluded:
  - src/bindgen/cpp/pass.cr
  - src/bindgen/crystal/pass.cr
  - src/bindgen/crystal/type.cr
  - src/bindgen/parser/method.cr
  - src/bindgen/processor/instance_properties.cr

# These `Bool` properties are configuration keys or widely used API, like
# `Call::Expression#reference`.  Renaming them would break configurations and
# code.
Naming/QueryBoolMethods:
  Excluded:
  - src/bindgen/call.cr
  - src/bindgen/configuration.cr
  - src/bindgen/find_path/configuration.cr
  - src/bindgen/type_database.cr

name: bindgen
version: 0.8.0
crystal: ">= 1.8.0, < 2.0.0"

description: C/C++/Qt binding and wrapper generator

authors:
  - Stefan Merettig <stefan-merettig@nuriaproject.org>

dependencies:
  toka:
    github: Papierkorb/toka
    commit: b2044c8410bd82a905db75f1ab23e895760544c7

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: ~> 1.7.0

targets:
  bindgen:
    main: src/bindgen.cr

# Required as bindgen will be used as a tool on its own.
scripts:
  postinstall: shards install --without-development
license: GPLv3
